services:
  epaper-nas-display:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.1.1}
    container_name: epaper-nas-display
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "15001:15001"
      - "15002:15001"
    volumes:
      - ./fonts:/fonts:ro
